<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>清邁旅行｜行程小幫手</title>

  <style>
    :root {
      --ink: #26352f;
      --muted: #758078;
      --green: #496b57;
      --cream: #f6f3ed;
      --card: #fffefa;
      --line: #e7e3d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", "PingFang TC", sans-serif;
    }

    button { font: inherit; cursor: pointer; }

    .hero {
      min-height: 275px;
      padding: 32px 20px 26px;
      color: white;
      background:
        linear-gradient(90deg, rgba(24,43,35,.76), rgba(24,43,35,.15)),
        url("https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1600&q=85")
        center 48% / cover;
    }

    .hero-inner, main {
      max-width: 820px;
      margin: auto;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .16em;
      opacity: .84;
    }

    h1 {
      margin: 12px 0 7px;
      font-size: clamp(30px, 7vw, 46px);
    }

    .hero p { margin: 0; opacity: .92; }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .hero button {
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 99px;
      padding: 9px 15px;
      color: white;
      background: rgba(255,255,255,.13);
    }

    main { padding: 18px 16px 52px; }

    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }

    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 9px 14px;
      color: var(--ink);
      background: var(--card);
    }

    .day-tab.active {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .day-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin: 10px 0 8px;
    }

    h2 { margin: 0; font-size: 23px; }

    .day-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .route {
      display: inline-block;
      margin: 6px 0 18px;
      color: var(--green);
      font-size: 13px;
      text-decoration: none;
    }

    .event {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .time {
      padding-top: 14px;
      font-weight: 700;
      font-size: 13px;
      color: var(--green);
      text-align: right;
    }

    .event-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 3px 12px rgba(45,54,45,.035);
    }

    .event-image {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
      background: #e8e5dc;
    }

    .event-content { padding: 13px 15px 14px; }

    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .event-title {
      flex: 1;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
    }

    .check {
      width: 21px;
      height: 21px;
      flex: none;
      accent-color: var(--green);
      margin-top: 2px;
    }

    .event.done .event-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .description {
      margin: 7px 0 10px;
      color: #535f57;
      font-size: 14px;
      line-height: 1.65;
    }

    .meta {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .map-link {
      display: inline-block;
      margin-top: 11px;
      color: var(--green);
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }

    .note {
      margin: 14px 0;
      padding: 13px 15px;
      border-radius: 12px;
      background: #f0eadd;
      color: #655642;
      font-size: 13px;
      line-height: 1.65;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding-top: 16px;
    }

    @media (min-width: 650px) {
      main { padding-top: 25px; }
      .event { grid-template-columns: 76px 1fr; gap: 16px; }
      .event-image { height: 205px; }
    }

    @media print {
      .hero { min-height: auto; padding: 20px; }
      .hero-actions, .day-tabs, .map-link { display: none; }
      main { max-width: none; }
      .event { break-inside: avoid; }
    }
  </style>
</head>

    const tabs = document.getElementById("dayTabs");
    const content = document.getElementById("dayContent");
    let activeDay = 0;

    function renderTabs() {
      tabs.innerHTML = days.map((day, i) =>
        `<button class="day-tab ${i === activeDay ? "active" : ""}"
          onclick="selectDay(${i})">
          Day ${i + 1} · ${day.date.split("（")[0]}
        </button>`
      ).join("");
    }

    function renderDay() {
      const day = days[activeDay];
      const saved = JSON.parse(localStorage.getItem("chiangmai-done") || "{}");

      content.innerHTML = `
        <div class="day-heading">
          <div>
            <h2>Day ${activeDay + 1}｜${day.date}</h2>
            <div class="day-subtitle">${day.title}</div>
          </div>
        </div>

        <a class="route" target="_blank" rel="noopener"
          href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.route)}">
          🗺 ${day.route}　↗
        </a>

        ${day.note ? `<div class="note">📌 ${day.note}</div>` : ""}

        <div class="timeline">
          ${day.events.map((e, i) => {
            const key = `${activeDay}-${i}`;
            const isDone = !!saved[key];

            return `
              <article class="event ${isDone ? "done" : ""}">
                <div class="time">${e.time}</div>
                <div class="event-card">
                  <img class="event-image" src="${e.image}" alt="${e.title}"
                    loading="lazy" onerror="this.style.display='none'">

                  <div class="event-content">
                    <div class="title-row">
                      <div class="event-title">${e.title}</div>
                      <input class="check" type="checkbox" aria-label="標記完成"
                        ${isDone ? "checked" : ""}
                        onchange="toggleDone('${key}', this.checked)">
                    </div>

                    <div class="description">${e.desc}</div>

                    <div class="meta">
                      <div>🚕 ${e.transport}</div>
                      <div>💰 ${e.cost}</div>
                    </div>

                    <a class="map-link" target="_blank" rel="noopener"
                      href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.place)}">
                      在 Google 地圖查看 ↗
                    </a>
                  </div>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function selectDay(i) {
      activeDay = i;
      renderTabs();
      renderDay();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleDone(key, checked) {
      const saved = JSON.parse(localStorage.getItem("chiangmai-done") || "{}");
      saved[key] = checked;
      localStorage.setItem("chiangmai-done", JSON.stringify(saved));
      renderDay();
    }

    async function shareTrip() {
      const shareData = {
        title: "清邁旅行行程",
        text: "清邁 5 天 4 夜旅行行程｜11/3–11/7",
        url: location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (_) {}
      } else if (location.protocol !== "file:") {
        try {
          await navigator.clipboard.writeText(location.href);
          alert("行程連結已複製，可以分享給同行夥伴！");
        } catch (_) {
          prompt("複製這個網址分享給夥伴：", location.href);
        }
      } else {
        alert("請先將檔案上傳到 GitHub Pages，取得網站網址後再分享。");
      }
    }

    renderTabs();
    renderDay();
  </script>
</body><script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js");
    });
  }
</script>
</html>
